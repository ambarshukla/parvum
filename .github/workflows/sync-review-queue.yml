# Keeps the internal app's review queue (and its mirrored PDFs) in sync with
# the lakehouse, unattended - the counterpart to export-gold.yml for the alts
# human-in-the-loop side.
#
# Reaches Postgres exactly the way export-gold.yml does after D-092: an SSH
# tunnel to a loopback-bound database, with a key restricted to
# permitopen=127.0.0.1:5432 and no shell. See that file for the full
# reasoning on why the publicly-accessible database (D-036) went away.
name: sync-review-queue

on:
  schedule:
    # Weekdays, 08:10 UTC - a few minutes behind export-gold (08:00), no
    # dependency between them, staggered so their logs don't interleave.
    - cron: "10 8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-review-queue
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: export
    steps:
      - uses: actions/checkout@v5

      - name: Open a tunnel to the serving Postgres
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          install -m 600 /dev/null ~/.ssh/parvum_ci
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/parvum_ci
          ssh -i ~/.ssh/parvum_ci -o BatchMode=yes -o ExitOnForwardFailure=yes \
            -f -N -L 5432:127.0.0.1:5432 ambar@${{ secrets.HETZNER_HOST }}
          for i in $(seq 1 15); do
            if timeout 2 bash -c '</dev/tcp/127.0.0.1/5432' 2>/dev/null; then
              echo "tunnel up"; exit 0
            fi
            sleep 1
          done
          echo "tunnel never became usable" >&2; exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"

      # Only sync-review-decisions needs this (it shells out to `databricks
      # fs cp`), but installing it once for the whole job is simpler than
      # scoping it to one step.
      - uses: databricks/setup-cli@v1.8.0

      - name: Install dependencies
        run: uv sync --locked

      # Push decisions made in the internal app back to the lakehouse first,
      # so they are in the volume before this run's load reads current state.
      - name: Sync review decisions back to the alts volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          PARVUM_PG_DSN: postgresql://parvum:${{ secrets.PARVUM_PG_PASSWORD }}@127.0.0.1:5432/parvum
        run: uv run parvum-sync-review-decisions

      # Independent of the step above (it just reads current lakehouse state),
      # so it still runs even if the sync step found nothing to sync or failed
      # outright - a stalled decision-sync must not also block the queue and
      # PDFs from refreshing.
      - name: Reload the review queue and mirrored PDFs
        if: always()
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          PARVUM_PG_DSN: postgresql://parvum:${{ secrets.PARVUM_PG_PASSWORD }}@127.0.0.1:5432/parvum
        run: uv run parvum-load-review-queue
