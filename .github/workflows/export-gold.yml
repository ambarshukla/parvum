# Keeps the serving Postgres in sync with gold, unattended.
#
# D-092 changed how this reaches the database. On AWS, RDS was deliberately
# publicly accessible (D-036) because a GitHub-hosted runner could not
# otherwise reach a private subnet without a NAT gateway - the one fixed cost
# D-005 had ruled out. On Hetzner that constraint is gone, so Postgres is
# bound to 127.0.0.1 on the host and this workflow reaches it through an SSH
# tunnel instead. Nothing listens on the public internet for the database.
#
# The key used here cannot get a shell: authorized_keys pins it to a forced
# command with `restrict`, re-enabling only port-forwarding and only to
# 127.0.0.1:5432. A stolen key can move gold data into this Postgres and
# nothing else.
#
# The exporter still runs ON THE RUNNER, not on the host, so the Databricks
# PAT stays in GitHub secrets and never lands on the box.
name: export-gold

on:
  schedule:
    # Weekdays, 08:00 UTC - ~1h45m after the daily feed lands (06:15), enough
    # buffer for bronze -> silver -> dq_recon -> gold to finish.
    - cron: "0 8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: export-gold
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: export
    steps:
      - uses: actions/checkout@v5

      - name: Open a tunnel to the serving Postgres
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          install -m 600 /dev/null ~/.ssh/parvum_ci
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/parvum_ci
          ssh -i ~/.ssh/parvum_ci -o BatchMode=yes -o ExitOnForwardFailure=yes \
            -f -N -L 5432:127.0.0.1:5432 ambar@${{ secrets.HETZNER_HOST }}
          # Prove the forward is actually usable before the exporter tries it,
          # so a tunnel failure reports itself here rather than as a confusing
          # connection error several steps later.
          for i in $(seq 1 15); do
            if timeout 2 bash -c '</dev/tcp/127.0.0.1/5432' 2>/dev/null; then
              echo "tunnel up"; exit 0
            fi
            sleep 1
          done
          echo "tunnel never became usable" >&2; exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"

      - name: Install dependencies
        run: uv sync --locked

      # sslmode is absent: the connection runs inside an SSH tunnel, which is
      # already authenticated and encrypted. Postgres itself sees a loopback
      # connection on the host.
      - name: Reload the serving database from gold
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          PARVUM_PG_DSN: postgresql://parvum:${{ secrets.PARVUM_PG_PASSWORD }}@127.0.0.1:5432/parvum
        run: uv run parvum-export-gold
