# Deploy path (D-092): build the serving image ON the target host and restart
# it there, over SSH. This replaces the AWS path (build -> ECR -> force a new
# ECS deployment), which disappeared with the move off AWS.
#
# Auth is an SSH key held as a repo secret, but that key cannot get a shell:
# authorized_keys pins it to a forced command (/opt/parvum/bin/ci-run.sh) with
# `restrict`, so the only things it can do are `deploy` and open a tunnel to
# 127.0.0.1:5432. Anything else is refused and logged on the host.
name: deploy-serving

on:
  push:
    branches: [main]
    paths:
      - "serving/**"
      - ".github/workflows/deploy-serving.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false # never cancel a deploy mid-flight

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Add the host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install the deploy key
        run: |
          install -m 600 /dev/null ~/.ssh/parvum_ci
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/parvum_ci

      # The host does the work: fetch origin/main, rebuild the image, restart
      # the container, and poll /q/health before reporting success. A boot
      # failure therefore fails this step rather than passing silently.
      - name: Deploy
        run: ssh -i ~/.ssh/parvum_ci -o BatchMode=yes ambar@${{ secrets.HETZNER_HOST }} deploy

      - name: Verify the public endpoint
        run: |
          set -e
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            https://parvum-api.ambarshukla.dev/q/health)
          echo "health endpoint returned $code"
          test "$code" = "200"
