      as_of:
      invariant:
      scope:
      expected:
      actual:
      delta:
      tolerance:
      holds:
        tier: critical
        definition: >-
          Whether an aggregate equalled the parts that should reconstruct it. FALSE is not a
          bad day in the data — it is two published figures disagreeing about the same fact,
