        quality_rules:
          - daily_return_plausibility_rate
      band:
      restatement_declared:
      restatement_detail:
      plausible:
        tier: critical
        definition: >-
          Whether the day's move is either inside the band or accounted for by a declared
          restatement. FALSE is not a bad day in the markets — it is a number nobody has
          explained, on a figure a client reads.
        slo: return_plausibility
        quality_rules:
