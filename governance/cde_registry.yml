      account_id:
      security_scheme:
      security_id:
      finding:
      field:
      semt002_value:
      mt535_value:
      rebuilt_at:
  dq_metrics:
    owner: data-quality
    default_tier: supporting
    columns:
      as_of:
        tier: supporting
        owner: data-quality
      dimension:
      metric:
      value:
        tier: supporting
        owner: data-quality
      passed:
        tier: supporting
        owner: data-quality
      detail:
      rebuilt_at:
  gold_alts_holdings:
    owner: alts-operations
    default_tier: supporting
    columns:
      client_id:
      client_name:
      fund_id:
      fund_name:
      account_id:
      currency:
      inception_date:
      as_of:
      total_commitment_usd:
        tier: critical
        definition: >-
          Owner-prorated total capital committed to a fund, in USD — the denominator of every
          alts ratio and the basis of an unfunded-commitment liability.
        slo: gold_freshness
        quality_rules:
          - cross_field_invariant_rate
        control_gap: >-
          Narrowed by cross_field_invariant_rate (D-073), which asserts that a commitment
          equals called plus unfunded — the identity whose silent failure was D-072, now a
          daily signal. What remains uncovered is extraction accuracy: the alts chain is
          validated document-to-document in silver (commitment continuity, call sequencing,
          statement chaining) but none of that rolls up into dq_metrics, so
          there is no measured accuracy rate for fund figures the way there is for holdings and
          cash. Closing it needs an alts dimension in the DQ rollup.
      called_to_date_usd:
        tier: critical
        definition: >-
          Owner-prorated cumulative capital called by the fund, in USD, as extracted from
          capital call notices and confirmed by review.
        slo: gold_freshness
        quality_rules:
          - cross_field_invariant_rate
        control_gap: >-
          Narrowed by cross_field_invariant_rate (D-073), which asserts that a commitment
          equals called plus unfunded — the identity whose silent failure was D-072, now a
          daily signal. What remains uncovered is extraction accuracy: the alts chain is
          validated document-to-document in silver (commitment continuity, call sequencing,
          statement chaining) but none of that rolls up into dq_metrics, so
          there is no measured accuracy rate for fund figures the way there is for holdings and
          cash. Closing it needs an alts dimension in the DQ rollup.
      distributed_to_date_usd:
        tier: critical
        definition: >-
          Owner-prorated cumulative capital distributed by the fund, in USD.
        slo: gold_freshness
        control_gap: >-
          The alts chain is validated document-to-document in silver (commitment continuity,
          call sequencing, statement chaining) but none of that rolls up into dq_metrics, so
          there is no measured accuracy rate for fund figures the way there is for holdings and
          cash. Closing it needs an alts dimension in the DQ rollup.
      unfunded_commitment_usd:
        tier: critical
        definition: >-
          Commitment not yet called, owner-prorated and in USD — a forward liquidity obligation
          the client must be able to meet, so understating it is a planning failure, not a
          reporting one.
        slo: gold_freshness
        quality_rules:
          - cross_field_invariant_rate
        control_gap: >-
          Narrowed by cross_field_invariant_rate (D-073), which asserts that a commitment
          equals called plus unfunded — the identity whose silent failure was D-072, now a
          daily signal. What remains uncovered is extraction accuracy: the alts chain is
          validated document-to-document in silver (commitment continuity, call sequencing,
          statement chaining) but none of that rolls up into dq_metrics, so
          there is no measured accuracy rate for fund figures the way there is for holdings and
          cash. Closing it needs an alts dimension in the DQ rollup.
      current_nav_usd:
        tier: critical
        definition: >-
          Owner-prorated ending balance from the latest confirmed capital account statement, in
          USD.
        slo: gold_freshness
        control_gap: >-
          The alts chain is validated document-to-document in silver (commitment continuity,
          call sequencing, statement chaining) but none of that rolls up into dq_metrics, so
          there is no measured accuracy rate for fund figures the way there is for holdings and
          cash. Closing it needs an alts dimension in the DQ rollup.
      moic:
        tier: critical
        definition: >-
          Multiple on invested capital: distributions plus current NAV over capital called. The
          headline fund performance figure, and owner-invariant because it is a ratio.
        slo: gold_freshness
        control_gap: >-
          The alts chain is validated document-to-document in silver (commitment continuity,
          call sequencing, statement chaining) but none of that rolls up into dq_metrics, so
          there is no measured accuracy rate for fund figures the way there is for holdings and
          cash. Closing it needs an alts dimension in the DQ rollup.
      pending_review_documents:
      pending_review_latest_period:
      rebuilt_at:
  gold_asset_allocation:
    owner: client-reporting
    default_tier: supporting
    columns:
      as_of:
      client_id:
      client_name:
      asset_class:
      value_usd:
        tier: critical
        definition: >-
          Owner-prorated USD value of one asset class for a client on a date — the basis of
          every allocation decision taken off this platform.
        slo: holdings_agreement
        quality_rules:
          - holdings_cross_format_match_rate
      weight:
        tier: critical
        definition: >-
          This asset class as a fraction of the client's total wealth; weights per client and
          date sum to one. Drives rebalancing conversations.
        slo: holdings_agreement
        quality_rules:
          - holdings_cross_format_match_rate
      rebuilt_at:
  gold_client_wealth:
    owner: client-reporting
    default_tier: supporting
    columns:
      as_of:
      client_id:
      client_name:
      positions_usd:
        tier: critical
        definition: >-
          The client's owner-prorated securities value in USD — the largest component of the
          headline wealth figure a client sees.
        slo: holdings_agreement
        quality_rules:
          - holdings_cross_format_match_rate
          - files_landed_rate
      cash_usd:
        tier: critical
        definition: >-
          The client's owner-prorated closing cash in USD, as reported on the client's
          statement.
        slo: cash_ledger_integrity
        quality_rules:
          - cash_conformed_consistency_rate
          - cash_day_over_day_continuity_rate
      alts_usd:
        tier: critical
        definition: >-
          The client's owner-prorated private-fund NAV in USD, forward-filled from the most
          recent confirmed capital account statement.
        slo: gold_freshness
        control_gap: >-
          The alts chain is validated document-to-document in silver (commitment continuity,
          call sequencing, statement chaining) but none of that rolls up into dq_metrics, so
          there is no measured accuracy rate for fund figures the way there is for holdings and
          cash. Closing it needs an alts dimension in the DQ rollup.
      total_wealth_usd:
        tier: critical
        definition: >-
          The headline number: positions plus cash plus alternatives, owner-prorated and in
          USD. The figure the client reads first and the one every conversation starts from.
        slo: gold_freshness
        quality_rules:
          - files_landed_rate
          - holdings_cross_format_match_rate
          - cash_conformed_consistency_rate
          - cross_field_invariant_rate
      fx_rate_used:
        tier: critical
        definition: >-
          The EUR to USD ECB reference rate applied to this date's EUR amounts. Wrong here and
          every non-USD figure in the report is wrong by the same proportion.
        slo: gold_freshness
        control_gap: >-
          Nothing re-checks a landed ECB rate against its source or against a plausibility band
          once it is in the lakehouse. A wrong or silently stale rate would misstate every
          EUR-denominated figure while every other control still passed. Closing it needs a
          reference-data check in dq_metrics comparing fx_rates.json against a second source.
      fx_rate_date:
      books_reconcile:
        tier: critical
        definition: >-
          The quality verdict shown to the client: true when the conformed cash check passes
          for every account they own on this date. An assertion about the platform's own
          trustworthiness, so a wrong value is worse than a missing one.
        slo: cash_ledger_integrity
        quality_rules:
          - cash_conformed_consistency_rate
          - cash_integrity_breaks_count
      reconcile_break_accounts:
      reconcile_variance_usd:
      rebuilt_at:
  gold_income:
    owner: client-reporting
    default_tier: supporting
    columns:
      client_id:
      client_name:
      month:
      type:
      income_usd:
        tier: critical
        definition: >-
          Owner-prorated dividend and interest income in USD for a client and month — a figure
          clients reconcile against their own records and their tax position.
        slo: cash_ledger_integrity
        quality_rules:
          - cash_conformed_consistency_rate
          - cash_integrity_breaks_count
      movements:
      rebuilt_at:
  gold_ownership:
    owner: reference-data
    default_tier: supporting
    columns:
      account_id:
      client_id:
      client_name:
      ownership_pct:
      owner_count:
      is_shared:
      rebuilt_at:
  gold_performance:
    owner: client-reporting
    default_tier: supporting
    columns:
      as_of:
      client_id:
      client_name:
      total_wealth_usd:
      external_flow_usd:
        tier: critical
        definition: >-
          Net client contribution or withdrawal in USD on a date. Misclassifying a flow as
          market movement (or the reverse) corrupts every return figure downstream of it.
        slo: cash_ledger_integrity
        quality_rules:
          - cash_conformed_consistency_rate
      restatement_adjustment_usd:
        tier: critical
        definition: >-
          Value change on a declared book-restatement day that the market did not produce.
          Removed from all three return methodologies and disclosed separately: it is neither
          the client's money nor the manager's doing, and letting it stay in either bucket is
          exactly the error of 2026-08-17.
        slo: return_plausibility
        quality_rules:
          - daily_return_plausibility_rate
      restatement_detail:
        tier: supporting
        owner: client-reporting
      daily_twr_return:
        tier: critical
        definition: >-
          The day's time-weighted return, with the client's own flows removed — the building
          block every reported return is chained from.
        slo: gold_freshness
        quality_rules:
          - daily_return_plausibility_rate
        control_gap: >-
          Narrowed, not closed (D-070). The original wording here proposed recomputing the
          returns independently — and that would not have caught the failure that actually
          happened on 2026-08-17, because the formula was never wrong: a book restatement
          changed what an input meant and a second implementation would have reproduced the
          same +414% faithfully. daily_return_plausibility_rate closes that case by bounding
          the day-over-day move and requiring a declared restatement for anything outside it.
          What remains uncovered is the small silent regression: an off-by-one in the chaining
          window or a mis-signed flow moves the figure by less than the band and still passes.
          Closing that needs the independent re-derivation from silver, which is now a
          second-order gap rather than the only line of defence.
      twr_index_since_inception:
        tier: critical
        definition: >-
          Chain-linked growth-of-one-dollar index from the client's first date; the series the
          performance chart draws.
        slo: gold_freshness
        quality_rules:
          - daily_return_plausibility_rate
        control_gap: >-
          Narrowed, not closed (D-070). The original wording here proposed recomputing the
          returns independently — and that would not have caught the failure that actually
          happened on 2026-08-17, because the formula was never wrong: a book restatement
          changed what an input meant and a second implementation would have reproduced the
          same +414% faithfully. daily_return_plausibility_rate closes that case by bounding
          the day-over-day move and requiring a declared restatement for anything outside it.
          What remains uncovered is the small silent regression: an off-by-one in the chaining
          window or a mis-signed flow moves the figure by less than the band and still passes.
          Closing that needs the independent re-derivation from silver, which is now a
          second-order gap rather than the only line of defence.
      rebuilt_at:
  gold_performance_summary:
    owner: client-reporting
    default_tier: supporting
    columns:
      client_id:
      client_name:
      inception_date:
      as_of:
      wealth_begin_usd:
      wealth_end_usd:
      net_external_flow_usd:
      restatement_adjustment_usd:
        tier: critical
        definition: >-
          Total value change from declared book restatements over the reported window, removed
          from TWR, Dietz and IRR alike and shown beside them so the reader can see what was
          taken out rather than having to trust that something was.
        slo: return_plausibility
        quality_rules:
          - daily_return_plausibility_rate
      twr_since_inception:
        tier: critical
        definition: >-
          Since-inception time-weighted return — the headline performance figure, and the one
          comparable to a benchmark because the client's own flows are removed.
        slo: gold_freshness
        quality_rules:
          - daily_return_plausibility_rate
        control_gap: >-
          Narrowed, not closed (D-070). The original wording here proposed recomputing the
          returns independently — and that would not have caught the failure that actually
          happened on 2026-08-17, because the formula was never wrong: a book restatement
          changed what an input meant and a second implementation would have reproduced the
          same +414% faithfully. daily_return_plausibility_rate closes that case by bounding
          the day-over-day move and requiring a declared restatement for anything outside it.
          What remains uncovered is the small silent regression: an off-by-one in the chaining
          window or a mis-signed flow moves the figure by less than the band and still passes.
          Closing that needs the independent re-derivation from silver, which is now a
          second-order gap rather than the only line of defence.
      dietz_since_inception:
        tier: critical
        definition: >-
          Modified Dietz return over the same window, published beside TWR so the methodology
          difference is visible rather than hidden.
        slo: gold_freshness
        quality_rules:
          - daily_return_plausibility_rate
        control_gap: >-
          Narrowed, not closed (D-070). The original wording here proposed recomputing the
          returns independently — and that would not have caught the failure that actually
          happened on 2026-08-17, because the formula was never wrong: a book restatement
          changed what an input meant and a second implementation would have reproduced the
          same +414% faithfully. daily_return_plausibility_rate closes that case by bounding
          the day-over-day move and requiring a declared restatement for anything outside it.
          What remains uncovered is the small silent regression: an off-by-one in the chaining
          window or a mis-signed flow moves the figure by less than the band and still passes.
          Closing that needs the independent re-derivation from silver, which is now a
          second-order gap rather than the only line of defence.
      irr_since_inception_annualized:
        tier: critical
        definition: >-
          Money-weighted (annualized IRR) return over the same cash flows — what the client
          actually earned given when they added and withdrew money.
        slo: gold_freshness
        quality_rules:
          - daily_return_plausibility_rate
        control_gap: >-
          Narrowed, not closed (D-070). The original wording here proposed recomputing the
          returns independently — and that would not have caught the failure that actually
          happened on 2026-08-17, because the formula was never wrong: a book restatement
          changed what an input meant and a second implementation would have reproduced the
          same +414% faithfully. daily_return_plausibility_rate closes that case by bounding
          the day-over-day move and requiring a declared restatement for anything outside it.
          What remains uncovered is the small silent regression: an off-by-one in the chaining
          window or a mis-signed flow moves the figure by less than the band and still passes.
          Closing that needs the independent re-derivation from silver, which is now a
