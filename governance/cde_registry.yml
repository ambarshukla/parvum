# Critical Data Element register.
#
# One entry for every column this platform publishes, saying who owns it and
# how critical it is; and, for the critical ones, what it means in business
# terms, what service level it is held to, and which control tests it — or,
# honestly, that none does yet.
#
# `parvum-check-governance` reconciles this file against the `COLUMN_COMMENTS`
# dicts in `spark/*.py` on every pull request, so it cannot drift from what
# the platform actually publishes: a new column fails the build until it is
# classified here, and an entry for a dropped column fails it too.
#
# Tiers, and what each obliges its publisher to supply (the obligations
# themselves live in `registry.py`, not here — a register that could relax
# its own rules would not be a control):
#
#   critical     A value the business consumes directly — what a client sees
#                on a statement, or what a decision is taken on — where a
#                wrong figure causes material harm and would not be obvious.
#                Owes: owner, business definition, an SLO, and either the
#                quality rules that test it or a stated control_gap.
#   supporting   Feeds or qualifies a critical element, or is needed to
#                interpret one. Owes: an owner.
#   operational  Pipeline plumbing — provenance, timestamps, hashes. Owes:
#                an owner.
#
# The critical list is deliberately short (about 8% of columns). Criticality
# stops at the layer the business consumes: the upstream columns a critical
# figure is computed from are `supporting`, which is what that tier means. If
# everything were critical the register would say nothing at all.

version: 1

owners:
  client-reporting: >-
    Publishes what a client sees — wealth, allocation, income, performance,
    and the reconciliation verdict attached to them.
  reference-data: >-
    Owns the identifiers, the account universe, the ownership graph and the
    FX rates every other layer resolves against.
  custody-ingestion: >-
    Owns the custodial feeds as received and their conformed silver form —
    positions, cash balances and cash movements.
  alts-operations: >-
    Owns the private-fund document chain end to end: extraction, validation,
    human review, and the fund figures that come out of it.
  data-quality: >-
    Owns the controls themselves — the reconciliation, integrity and
    continuity checks and the metrics that roll them up.
  platform-ops: >-
    Owns the pipeline's own machinery: landing, restatement detection, run
    provenance and rebuild timestamps.

# Named service levels. `measured_by` must be a metric `dq_metrics` really
# computes, so an SLO can always be evidenced. These are objectives the
# estate is held to, not claims about current attainment — measuring
# attainment against them is the next slice of work.
slos:
  feed_completeness:
    objective: Every expected custodial file for a business day lands and parses.
    measured_by: files_landed_rate
    target: 100% of expected files on every business day
  gold_freshness:
    objective: Client-facing figures reflect the most recent custodial feeds.
    measured_by: bronze_days_behind
    target: no more than 2 days behind on any business day
  holdings_agreement:
    objective: Positions agree across the two custodial holdings formats.
    measured_by: holdings_cross_format_match_rate
    target: 99% of account-days or better
  cash_ledger_integrity:
    objective: Each account's cash ledger adds up — opening plus movements equals closing.
    measured_by: cash_conformed_consistency_rate
    target: 99% of account-days or better
  cash_continuity:
    objective: Each account's closing balance carries into the next day's opening.
    measured_by: cash_day_over_day_continuity_rate
    target: 100% of account-days

# Column names that mean the same thing wherever they appear, declared once.
# A table may still override any of them for a column that genuinely differs
# (see dq_metrics.as_of, which is a fact about now rather than a business
# date). Resolution order is table defaults, then this block, then the
# column's own entry.
common_columns:
  client_id:
    tier: supporting
    owner: reference-data
    definition: >-
      The family or relationship a row belongs to; the grain every client-facing report rolls
      up to.
  client_name:
    tier: supporting
    owner: reference-data
  account_id:
    tier: supporting
    owner: reference-data
  ownership_pct:
    tier: critical
    owner: reference-data
    definition: >-
      A client's effective fraction of an account, resolved through the ownership graph. Every
      prorated figure in the estate is multiplied by this, so an error here misstates one
      client's wealth and another's in opposite directions while both still reconcile to the
      custodian.
    slo: gold_freshness
    control_gap: >-
      The ownership graph proves itself acyclic and fully allocated when it is built, and a
      unit test holds a shared account to reassembling at 100%, but neither assertion reaches
      dq_metrics — so there is no daily measured signal. Closing it needs an ownership
      dimension in the DQ rollup.
  as_of:
    tier: supporting
    owner: custody-ingestion
  currency:
    tier: supporting
    owner: reference-data
  security_scheme:
    tier: supporting
    owner: reference-data
  security_id:
    tier: supporting
    owner: reference-data
  security_name:
    tier: supporting
    owner: reference-data
  fund_id:
    tier: supporting
    owner: alts-operations
  doc_type:
    tier: supporting
    owner: alts-operations
  rebuilt_at:
    tier: operational
    owner: platform-ops
  ingested_at:
    tier: operational
    owner: platform-ops
  source_file:
    tier: operational
    owner: platform-ops
  file_path:
    tier: operational
    owner: platform-ops
  sha256:
    tier: supporting
    owner: platform-ops
    definition: >-
      Content hash of the landed file; restatement is detected by this, not by path.

