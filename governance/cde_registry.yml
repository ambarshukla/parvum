      as_of:
      client_id:
      client_name:
      total_wealth_usd:
      prev_wealth_usd:
      external_flow_usd:
      non_flow_move_rate:
        tier: critical
        definition: >-
          The day-over-day move in client wealth with the client's own flows removed, computed
          from the raw wealth series rather than from the published return — so a restatement
